name: Release on merge to main

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES secret is not set. google-services.json will not be created."
          fi

      - name: Configure API keys
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY secret is required to build the release APK."
            exit 1
          fi
          if [ -z "$ORS_API_KEY" ]; then
            echo "::error::ORS_API_KEY secret is required to build the release APK."
            exit 1
          fi

          printf 'MAPS_API_KEY=%s\nORS_API_KEY=%s\n' "$MAPS_API_KEY" "$ORS_API_KEY" > local.properties

      # Signs the APK with a fixed key registered in Firebase. Without it, the runner generates a
      # random debug key on every run, and Google Sign-In fails in the published APK.
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE" ]; then
            echo "::error::DEBUG_KEYSTORE secret is required to build a release APK that can sign in."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "artista-${GITHUB_RUN_NUMBER}.apk"

      - name: Create GitHub release and attach APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "artista-${GITHUB_RUN_NUMBER}.apk" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --generate-notes
