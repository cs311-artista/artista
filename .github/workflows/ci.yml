name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ci:
    name: CI
    # Execute the CI on the course's runners
    runs-on: ubuntu-latest

    steps:
      # First step : Checkout the repository on the runner
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis (if we use Sonar Later)

      # Decode the Firebase credentials before running Gradle build tasks
      
      - name: Decode secrets
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES secret is not set. google-services.json will not be created."
          fi

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # Caching is a very useful part of a CI, as a workflow is executed in a clean environment every time,
      # this means that one would need to re-download and re-process Gradle files for every run. Which is very time-consuming.
      #
      # To avoid that, we cache the Gradle folder to reuse it later.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Cache the Emulator, if the cache does not hit, create the emulator.
      # API 34 matches targetSdk. compileSdk 37 is only the compile platform.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Check formatting
      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      # This step runs Gradle commands to build the application
      - name: Assemble
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assemble lint --parallel --build-cache

      # Set up Node.js for the Firebase CLI.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      # Run Unit tests
      - name: Run Unit tests
        run: |
          # To run the CI with debug information, add --info
          ./gradlew check --parallel --build-cache

      # Start the Firebase emulators required by the connected tests.
      - name: Start Firebase Auth and Firestore emulators
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -Eeuo pipefail

          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            FIREBASE_PROJECT_ID="$(jq -r '.project_info.project_id' app/google-services.json)"
          fi

          if [ -z "$FIREBASE_PROJECT_ID" ] || [ "$FIREBASE_PROJECT_ID" = "null" ]; then
            echo "Firebase project ID is not configured."
            exit 1
          fi

          for port in 8080 9099; do
            fuser -k "${port}/tcp" 2>/dev/null || true
          done

          firebase emulators:start \
            --only auth,firestore \
            --config firebase.json \
            --project "$FIREBASE_PROJECT_ID" \
            --host 0.0.0.0 \
            > "$RUNNER_TEMP/firebase-emulator.log" 2>&1 &

          emulator_pid=$!
          echo "$emulator_pid" > "$RUNNER_TEMP/firebase-emulator.pid"

          for attempt in {1..30}; do
            if nc -z 127.0.0.1 9099 && \
              curl --silent --fail \
                "http://127.0.0.1:8080/emulator/v1/projects/$FIREBASE_PROJECT_ID/databases/(default)/documents" \
                >/dev/null; then
              echo "Firebase Auth and Firestore emulators are ready"
              exit 0
            fi

            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Firebase emulator stopped unexpectedly:"
              cat "$RUNNER_TEMP/firebase-emulator.log"
              exit 1
            fi

            sleep 2
          done

          echo "Timed out waiting for Firebase Auth and Firestore emulators:"
          cat "$RUNNER_TEMP/firebase-emulator.log"
          exit 1

      # Run connected tests on the emulator
      - name: Run Connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedCheck --parallel --build-cache

      # Stop Firebase emulator
      - name: Stop Firebase emulator
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/firebase-emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/firebase-emulator.pid")" 2>/dev/null || true
          fi

          for port in 8080 9099; do
            fuser -k "${port}/tcp" 2>/dev/null || true
          done

          if [ -f "$RUNNER_TEMP/firebase-emulator.log" ]; then
            cat "$RUNNER_TEMP/firebase-emulator.log"
          fi

      # This step generates the coverage report which will be uploaded to sonar
      - name: Generate Coverage Report
        run: |
          ./gradlew jacocoTestReport

      # Upload the various reports to sonar
      - name: Upload report to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache
